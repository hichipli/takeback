  <rect width="1760" height="868" rx="32" fill="url(#bg)"/>
  <rect x="1" y="1" width="1758" height="866" rx="31" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="96" y="132" font-family="Menlo, PingFang SC" font-size="22" letter-spacing="3" fill="#3fb950">工作原理</text>
  <text x="96" y="214" font-family="PingFang SC" font-weight="600" font-size="58" letter-spacing="0" fill="#e6edf3">每次提示词之前、每轮结束之后，各存一个检查点。</text>
  <line x1="110" y1="356.0" x2="110" y2="692.0" stroke="#30363d" stroke-width="3"/>
