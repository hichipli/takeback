<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 868">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  </defs>
  <rect width="1760" height="868" rx="32" fill="url(#bg)"/>
  <rect x="1" y="1" width="1758" height="866" rx="31" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="96" y="132" font-family="Menlo" font-size="22" letter-spacing="6" fill="#3fb950">HOW IT WORKS</text>
  <text x="96" y="214" font-family="Avenir Next" font-weight="600" font-size="58" letter-spacing="-1" fill="#e6edf3">A checkpoint before every prompt and after every turn.</text>
  <line x1="110" y1="356.0" x2="110" y2="692.0" stroke="#30363d" stroke-width="3"/>
  <circle cx="110" cy="356.0" r="13" fill="#3fb950"/>
  <text x="160" y="367.0" font-family="Avenir Next" font-size="31" fill="#e6edf3">You send a prompt</text>
  <text x="1664" y="365.0" text-anchor="end" font-family="Menlo" font-size="24" fill="#3fb950">claude · before "clean up the build scripts"</text>
  <line x1="160" y1="412" x2="1664" y2="412" stroke="#21262d" stroke-width="2"/>
  <circle cx="110" cy="468.0" r="11" fill="#0d1117" stroke="#8b949e" stroke-width="4"/>
  <text x="160" y="479.0" font-family="Avenir Next" font-size="31" fill="#e6edf3">The agent edits files and runs commands</text>
  <text x="1664" y="477.0" text-anchor="end" font-family="Menlo" font-size="24" fill="#8b949e">rm -rf scripts  ·  sed -i 's/1.4/2.0/' package.json</text>
  <line x1="160" y1="524" x2="1664" y2="524" stroke="#21262d" stroke-width="2"/>
  <circle cx="110" cy="580.0" r="13" fill="#3fb950"/>
  <text x="160" y="591.0" font-family="Avenir Next" font-size="31" fill="#e6edf3">The turn ends</text>
  <text x="1664" y="589.0" text-anchor="end" font-family="Menlo" font-size="24" fill="#3fb950">claude · after "clean up the build scripts"</text>
  <line x1="160" y1="636" x2="1664" y2="636" stroke="#21262d" stroke-width="2"/>
  <circle cx="110" cy="692.0" r="22" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <g transform="translate(99 682.0) scale(0.0625)" fill="none" stroke="#3fb950" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"><path d="M120 0 L0 120 L120 240"/><path d="M0 120 H200 a80 80 0 0 1 0 160 H100"/></g>
  <text x="160" y="703.0" font-family="Menlo" font-size="32" fill="#3fb950">npx takeback</text>
  <text x="1664" y="701.0" text-anchor="end" font-family="Avenir Next" font-size="28" fill="#3fb950">every file back as it was before the prompt</text>
  <text x="96" y="810" font-family="Avenir Next" font-size="27" fill="#8b949e">Checkpoints live in a separate git repo in ~/.takeback. Your project&#8217;s .git is never touched.</text>
</svg>

