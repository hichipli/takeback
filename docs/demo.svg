<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 482" role="img" aria-label="An agent deletes scripts/ through Bash, and takeback restores it with one command">
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; white-space: pre; }
    .dim { fill: #8b949e; }
    .ps { fill: #3fb950; }
    .ok { fill: #3fb950; }
    .id { fill: #d29922; }
    .err { fill: #f85149; }
    .agent { fill: #d2a8ff; }
  </style>
  <rect width="920" height="482" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="919" height="481" rx="12" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>

  <text x="24" y="66"><tspan class="ps">$</tspan> claude</text>
  <text x="24" y="90"><tspan class="dim">&gt;</tspan> clean up the build scripts</text>
  <text x="24" y="114"><tspan class="agent">⏺</tspan> Bash(rm -rf scripts &amp;&amp; sed -i '' 's/1.4.2/2.0.0/' package.json)</text>
  <text x="24" y="138"><tspan class="agent">⏺</tspan> Done. Removed the old scripts/ folder and bumped the version.</text>

  <text x="24" y="182"><tspan class="ps">$</tspan> ls scripts</text>
  <text x="24" y="206" class="err">ls: scripts: No such file or directory</text>

  <text x="24" y="250"><tspan class="ps">$</tspan> npx takeback</text>
  <text x="24" y="274"><tspan class="ok">↩</tspan>  Took back to <tspan class="id">3f9c2a1</tspan> <tspan class="dim">·</tspan> claude · before "clean up the build scripts" <tspan class="dim">· 1 minute ago</tspan></text>
  <text x="24" y="298"><tspan class="dim">   reverted  </tspan>package.json</text>
  <text x="24" y="322"><tspan class="dim">   restored  </tspan>scripts/build.sh</text>
  <text x="24" y="346"><tspan class="dim">   restored  </tspan>scripts/release.sh</text>
  <text x="24" y="370" class="dim">   Changed your mind? takeback to 8d41e07</text>

  <text x="24" y="414"><tspan class="ps">$</tspan> ls scripts</text>
  <text x="24" y="438">build.sh  release.sh</text>
</svg>
